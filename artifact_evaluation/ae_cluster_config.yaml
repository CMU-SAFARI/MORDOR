cluster:
  # Hosted evaluator commands run from this checkout. setup_ae.sh creates and
  # populates repo_root; it may initially be absent.
  host: aevaluator2@safari-proxy.ethz.ch
  port: 22
  identity_file: credentials/ae_cluster_key
  working_directory: /mnt/galactica/aevaluator2/MORDOR
  repo_root: /mnt/galactica/aevaluator2/MORDOR
  workspace_root: /mnt/galactica/aevaluator2/MORDOR/artifact_workspace

  trace_dir: /mnt/galactica/aevaluator2/MORDOR/cputraces
  trace_archive_url: https://zenodo.org/records/21514600/files/mordor_cputraces_v1.tar.gz?download=1
  trace_archive_sha256: dafce2d59ebb84f29060ab779f615cff549734c8b1153e7bf3beaea29f7a97cf
  ramulator: /mnt/galactica/aevaluator2/MORDOR/ramulator/build/ramulator2
  python: python3
  partition: high_latency
  memory: 6GB
  exclude: kratos10

local:
  results_root: results
  paper_results_dir: paper_results
  figure_dir: figures
  plot_script: plotting/generate_paper_figures.py
  openroad_dir: openroad
