Frontend:
  impl: SimpleO3
  clock_ratio: 8
  num_expected_insts: 10000000
  traces: 
    - example_inst.trace

  Translation:
    impl: RandomTranslation
    max_addr: 2147483648
              

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: DDR5
    RFM: 
    org:
      preset: DDR5_8Gb_x8
      channel: 2
      rank: 2
    timing:
      preset: DDR5_3200AN
    drampower_enable: true
    voltage:
    current:

  Controller:
    impl: Blacklisting
    Scheduler:
      impl: FRFCFS_blacklisting
    RefreshManager:
      impl: AllBank
    plugins: 
     - ControllerPlugin: 
        tRH: 500
        impl: PARAddr5
        threshold: 0.067
        queue_type: read
        insecure_read_queue: false
    RowPolicy:
      impl: OpenRowPolicy


  AddrMapper:
    impl: MOP4CLXOR
